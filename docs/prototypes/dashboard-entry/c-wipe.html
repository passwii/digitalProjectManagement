<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>方案 C · GLASS WIPE</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="wipe.css" />
</head>
<body>
<div class="stage">
  <div class="bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="wipe" aria-hidden="true"></div>

  <span class="option-label">方案 C · GLASS WIPE</span>

  <div class="login-layer">
    <form class="login-card" onsubmit="return false;">
      <div class="brandline">
        <span class="seal" aria-hidden="true"><b>SHZK</b><i></i></span>
        <span><strong>数科云办公</strong><small>DIGITAL DELIVERY</small></span>
      </div>
      <p class="kicker">WELCOME BACK</p>
      <h2>欢迎回来</h2>
      <p class="sub">登录后继续你的工作台。</p>
      <div class="field"><label>手机号</label><input placeholder="请输入 11 位手机号" inputmode="numeric" /></div>
      <div class="field"><label>密码</label><input type="password" placeholder="请输入登录密码" /></div>
      <button class="login-submit" type="button" data-enter>进入工作台 <span aria-hidden="true">→</span></button>
    </form>
  </div>

  <div class="dashboard" aria-hidden="true">
    <header class="topbar">
      <span class="brand">
        <span class="seal"><b>SHZK</b><i></i></span>
        <span>数科云办公</span>
      </span>
      <nav class="pill">
        <span class="active">工作台</span><span>项目台账</span><span>进度跟踪</span><span>支出记录</span><span>审批中心</span>
      </nav>
      <span class="avatar">D</span>
    </header>
    <main class="hero">
      <h1 class="hello">你好<span class="name">Damon</span><span class="sub">项目、进度、支出与审批。</span></h1>
      <div class="cards">
        <div class="card"><small>01</small><h3>统一台账</h3><p>项目与客户关系对齐</p></div>
        <div class="card"><small>02</small><h3>进度留痕</h3><p>每个里程碑可追溯</p></div>
        <div class="card"><small>03</small><h3>支出归集</h3><p>票据与预算同屏</p></div>
        <div class="card"><small>04</small><h3>审批协同</h3><p>待办集中处理</p></div>
      </div>
    </main>
  </div>

  <a class="back" href="index.html">← 返回方案列表</a>
  <div class="note"><button class="replay" type="button" data-replay>重播</button><span>点「进入工作台」或「重播」</span></div>
</div>
<script src="base.js"></script>

</html>
