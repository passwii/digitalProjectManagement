# 本地开发覆盖配置：通过 Docker 内 SSH 隧道访问 VPS 上的 PostgreSQL。
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# 隧道地址不用再手改：scripts/db_tunnel.sh 会按序探活，v4 不通自动走 v6
# （机房侧 v4 出现过半死状态）。临时强制某个地址：VPS_SSH_HOST=...

services:
  db-tunnel:
    build:
      context: .
      dockerfile: docker/db-tunnel.Dockerfile
      network: host
    restart: unless-stopped
    environment:
      # 这三个是给 scripts/db_tunnel.sh 的覆盖入口，默认值只写在脚本里
      VPS_SSH_USER: "${VPS_SSH_USER:-}"
      VPS_SSH_HOST: "${VPS_SSH_HOST:-}"
      VPS_SSH_HOSTS: "${VPS_SSH_HOSTS:-}"
    # 显式用 sh 跑：脚本一旦被登录 shell 执行，就会踩到 zsh/bash 词分割不一致
    # 那类坑（悬空镜像回收刚被咬过一次）。
    command: ["sh", "/scripts/db_tunnel.sh"]
    volumes:
      - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - ${HOME}/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ./scripts/db_tunnel.sh:/scripts/db_tunnel.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      network: host
    depends_on:
      db-tunnel:
        condition: service_healthy
    environment:
      DB_FORWARD_HOST: db-tunnel
      DB_POOL_SIZE: 1
      DB_MAX_OVERFLOW: 0
      CORS_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"

  web:
    build: !reset null
    image: node:20-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8001/api/v1
    volumes:
      - ./web:/app
    command:
      - sh
      - -c
      - >
        if [ ! -x node_modules/.bin/next ]; then
          npm ci --registry=https://registry.npmmirror.com;
        fi;
        npm run build &&
        npm run start -- -H 0.0.0.0 -p 3001
