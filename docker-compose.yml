# 数慧致科OA管理平台 — Docker 仅启动 api + web
#
# 用法：
#   docker compose up --build
#   浏览器打开 http://localhost:3001/login
#
# 数据库：
#   默认 sqlite:////app/data/app.db（落在 pm-data）
#   推荐通过 DATABASE_URL 连接宿主机 PostgreSQL，不启动数据库容器
#   PostgreSQL 示例见 .env.docker.example
#
# 附件持久化：命名卷 pm-data 挂在 /app/data

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/app.db}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pm-data:/app/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8001/api/v1
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pm-data:
    name: "${DATA_VOLUME:-pm-data}"
