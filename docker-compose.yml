# 项目管理系统 MVP — 一键启动（api + web，SQLite 数据落 volume）
#
# 用法：
#   docker compose up --build
#   浏览器打开 http://localhost:3001/login   （admin / admin123456）
#
# 数据持久化：命名卷 pm-data 挂在 /app/data（SQLite 与附件都在这里）

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      TZ: Asia/Shanghai
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"
    volumes:
      - pm-data:/app/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8001/api/v1
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pm-data:
