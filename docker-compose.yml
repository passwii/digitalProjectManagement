# 数科云办公 — Docker 仅启动 api + web
#
# 用法：
#   docker compose up --build
#   浏览器打开 http://localhost:3001/login
#
# 数据库：
#   必须通过 DATABASE_URL 连接 PostgreSQL，不启动数据库容器
#   配置示例见 .env.docker.example
#
# 附件持久化：命名卷 pm-data 挂在 /app/data

# 附件存储：R2 是正文唯一的持久化口径，容器磁盘/命名卷不再承担持久化职责
# （命名卷只保留给 BLF-1136 之前落在 data/files 的存量附件）。

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      TZ: Asia/Shanghai
      APP_SECRET: "${APP_SECRET:?APP_SECRET must be set}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set to a PostgreSQL URL}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-10}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}"
      # 附件对象存储（BLF-1136）：R2 是正文唯一持久化口径。
      # r2（默认）/ auto 在 R2_* 不全时**启动即失败**；local 仅开发/测试，写临时暂存目录，
      # 且 APP_ENV=production 时被拒绝（生产环境不可能把正文落盘）。
      STORAGE_BACKEND: "${STORAGE_BACKEND:-r2}"
      APP_ENV: "${APP_ENV:-development}"
      STORAGE_LOCAL_ROOT: "${STORAGE_LOCAL_ROOT:-}"
      R2_ENDPOINT_URL: "${R2_ENDPOINT_URL:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_REGION: "${R2_REGION:-auto}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"
      R2_PRESIGN_TTL_SECONDS: "${R2_PRESIGN_TTL_SECONDS:-3600}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pm-data:/app/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8001/api/v1}"
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pm-data:
    name: "${DATA_VOLUME:-pm-data}"
