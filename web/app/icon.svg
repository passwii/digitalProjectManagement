<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PWA 应用图标（BLF-1127/S6）。深海军蓝底 + SHZK 印章，与侧栏品牌块同源。
       viewBox 512：矢量无损缩放到 manifest 里声明的 192 / 512；
       maskable 光栅版见 public/icons（中央安全区作画、全 bleed 底）。 -->
  <rect width="512" height="512" rx="112" fill="#0F2742"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#68AEFF" stroke-opacity="0.35" stroke-width="6"/>
  <text
    x="256"
    y="218"
    fill="#8CBCFF"
    font-family="Verdana, Geneva, Tahoma, sans-serif"
    font-size="118"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >SHZK</text>
  <rect x="132" y="282.5" width="248" height="19" rx="9.5" fill="#68AEFF" fill-opacity="0.65"/>
  <text
    x="256"
    y="350"
    fill="#D6E4F9"
    fill-opacity="0.72"
    font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="62"
    text-anchor="middle"
    dominant-baseline="central"
  >数科云办公</text>
</svg>
