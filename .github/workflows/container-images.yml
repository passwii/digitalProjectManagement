name: container-images

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "api/**"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "scripts/**"
      - "web/**"
      - ".github/workflows/container-images.yml"
      - ".github/workflows/deploy-vps.yml"

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build API and Web images (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production Compose merge
        env:
          API_IMAGE: ghcr.io/compose-check/digitalprojectmanagement-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEB_IMAGE: ghcr.io/compose-check/digitalprojectmanagement-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          APP_SECRET: compose-check
          DATABASE_URL: postgresql+psycopg://ci@127.0.0.1/app
          PM_DOMAIN: build.invalid
          PM_HOST_BIND: 127.0.0.1
          API_PORT_BIND: 127.0.0.1
          CORS_ORIGINS: https://build.invalid
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/pm-compose.json
          jq -e '
            .services.api.image == ("ghcr.io/compose-check/digitalprojectmanagement-api@sha256:" + ("a" * 64))
            and (.services.api | has("build") | not)
            and .services.web.image == ("ghcr.io/compose-check/digitalprojectmanagement-web@sha256:" + ("b" * 64))
            and (.services.web | has("build") | not)
          ' /tmp/pm-compose.json >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: false

      - name: Build Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE=https://build.invalid/api/v1
