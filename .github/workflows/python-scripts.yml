name: python-scripts

# scripts/ 下的 Python 单测此前没有任何 CI 入口。这里跑不依赖真实浏览器与
# 运行中站点的套件。
#
# 注意：scripts/test_tablet_layout_browser.py 仍为人工浏览器回归 —— 它需要先
# 构建并启动 web（Chrome + 站点），且当前与实现有两处漂移（/reports 月份
# 选择器触控高度、/projects 表格渲染），待 web 侧修复后再接入 CI。
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/prototypes/blf-1127-mobile-pwa/verify.py"
      - "web/components/ui/PageHeader.module.css"
      - ".github/workflows/python-scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "docs/prototypes/blf-1127-mobile-pwa/verify.py"
      - "web/components/ui/PageHeader.module.css"
      - ".github/workflows/python-scripts.yml"

concurrency:
  group: python-scripts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: scripts · Python 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gen_pwa_icons 生成中文副标需要真实 CJK 字体（缺失会直接报 IconBuildError）。
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # 只装验收工具依赖（playwright + Pillow），与运维脚本的 requirements-ops.txt 分开。
      - name: 安装验收工具依赖
        run: python -m pip install -r scripts/requirements-acceptance.txt

      - name: 运行 scripts 单测
        run: python -m unittest -v scripts.test_gen_pwa_icons scripts.test_acceptance_tablet_landscape
