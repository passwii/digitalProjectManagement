name: api

# 后端测试守门。前端那条见 web.yml。
#
# 这条 workflow 存在的直接原因：`tests/conftest.py` 在没有 TEST_DATABASE_URL 时
# 会让 `db` fixture 执行 pytest.skip。实测那意味着——
#     52 passed, 230 skipped in 0.31s，退出码 0
# 282 个用例里 230 个（82%）根本没执行，套件却判绿。
# 一个比没有 CI 更危险的假绿，所以下面同时加了两道防线（见「两道防线」注释）。
on:
  push:
    branches: [main]
  pull_request:
    # 后端套件要 7 分半，只在真的动到后端时才跑，避免纯前端 PR 白烧额度。
    # 测试只 import `api.*`，不依赖 api/ 与 tests/ 之外的任何路径。
    paths:
      - "api/**"
      - "tests/**"
      - ".github/workflows/api.yml"

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: api · 测试
    runs-on: ubuntu-latest
    # 注意 working-directory 留在仓库根：测试在根目录的 tests/，不在 api/ 下。
    # 依赖清单虽然也在 api/ 里，但装依赖和跑测试的路径不一样，所以不设这个默认值，
    # 在各自的 step 里写全路径。
    services:
      postgres:
        # 与本机开发用的 PostgreSQL 18 对齐（本机实测 18.6 全绿）。
        # 测试按 fixture 建随机 schema、用完 DROP，用的是最基础的 PG 特性，
        # 16/17/18 都行；这里跟开发环境保持一致，减少版本偏斜带来的意外。
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        # 必须显式发布端口。job 直接跑在宿主 runner 上（不是 job 容器内），
        # 而 GitHub 生成的 `docker create` **不会**自动把容器端口发布到宿主——
        # 漏掉这两行时容器是 healthy 的，但 TEST_DATABASE_URL 里的 localhost:5432
        # 会得到 "Connection refused"，230 个用例全部 ERROR。
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 第一道防线：url 拼错或没拼上时，pytest 会因连不上直接 ERROR（不会 skip），
      # 所以「url 写错」本身是安全的。真正危险的是它**为空**——见 conftest 里的第二道。
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      # 版本对齐本机开发环境（实测 Python 3.14.7 / PostgreSQL 18.6 全绿），
      # 而不是 docker/api.Dockerfile 里的 3.12 —— CI 要守住的是「开发者实际在用的
      # 那套环境」。注意这意味着 CI 跑 3.12 生产镜像跑不到的版本，反向的偏斜也存在，
      # 详见 PR 描述里的说明。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # requirements.txt 在 api/ 子目录里，不配 cache-dependency-path 的话
          # setup-python 找不到依赖清单，缓存会静默失效。
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: 安装依赖
        run: pip install -r api/requirements.txt

      - name: 测试
        # 第二道防线在 tests/conftest.py：CI 环境下缺 TEST_DATABASE_URL 直接
        # 抛错终止，而不是 skip。两条合起来保证「绿灯 == 用例真的跑了」。
        run: pytest tests -q
